name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Cache MongoDB binary (contract tests run against a real mongod)
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}
      - run: npx prettier --check .
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Firestore + Auth emulator tests
        run: npx --yes firebase-tools@14 emulators:exec --only firestore,auth --project demo-aaradhya-setu "npx vitest run tests/repository.contract.test.ts tests/auth.emulator.test.ts"
      - run: npm run build
